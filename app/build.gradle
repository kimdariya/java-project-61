plugins {
    id 'application'
    id 'checkstyle'
    id "org.sonarqube" version "7.3.1.8318"
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    checkstyle "com.puppycrawl.tools:checkstyle:${checkstyle.toolVersion}"
}

application {
    mainClass = 'hexlet.code.App'
    applicationName = 'app'
}

tasks.named('run', JavaExec) {
    standardInput = System.in
}

checkstyle {
    toolVersion = '10.12.0'
    configFile = file("config/checkstyle/checkstyle.xml")
}

tasks.withType(Checkstyle) {
    reports {
        xml.required = false
        html.required = true
    }
}

sonar {
    properties {
        property "sonar.projectKey", "kimdariya_java-project-612"
        property "sonar.organization", "kimdariya-1"
    }
}